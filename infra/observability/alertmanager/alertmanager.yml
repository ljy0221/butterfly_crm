# Alertmanager — 최소 라우팅 (Phase 1)
#
# 본 파일은 placeholder. 실제 알람 규칙은 SLO 정의서 확정 후 Phase 3.
# 현재는 부팅/healthz만 보장.

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: default
  group_by: [alertname, cluster, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # SEV-1 (페이지) — 즉시 Slack
    - matchers:
        - severity = critical
      receiver: slack-critical
      group_wait: 0s
      repeat_interval: 30m

    # SEV-2 (티켓 자동 생성) — 후속 티켓
    - matchers:
        - severity = warning
      receiver: slack-warning
      repeat_interval: 6h

receivers:
  - name: default
    # 기본은 무수신 (개발 단계 noise 차단)
  - name: slack-critical
    slack_configs:
      - channel: '#butterfly-alerts'
        send_resolved: true
        title: '[CRITICAL] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  - name: slack-warning
    slack_configs:
      - channel: '#butterfly-alerts-warning'
        send_resolved: true
        title: '[WARNING] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  # critical이 울리면 같은 service의 warning 억제
  - source_matchers: [severity = critical]
    target_matchers: [severity = warning]
    equal: [alertname, cluster, service]

templates: []
