# Butterfly Observability — 발급 EC2(`k14b101.p.ssafy.io`)에서 실행
#
# ADR-0018: node-exporter + Promtail (K8s 측, Phase 2) → 본 LGTM 서버로 push.
# 본 파일은 Phase 1 — LGTM 수집/조회 측만 담당.
#
# 부팅:
#   cd infra/observability && cp .env.example .env && vim .env  # 비밀번호 채움
#   docker compose up -d
#
# 외부 노출 (Caddy 경유만):
#   https://k14b101.p.ssafy.io/lgtm/loki/*    → loki:3100   (promtail push)
#   https://k14b101.p.ssafy.io/lgtm/prom/*    → prometheus:9090 (remote_write_receiver)
#   https://k14b101.p.ssafy.io/grafana/*      → grafana:3000   (운영자 UI)
#
# 내부 컨테이너 통신만 사용. host port는 80/443/9090(localhost-only)만 바인드.

services:

  # =========================================================================
  # Caddy — TLS 종료 + Basic Auth + 경로 분기 (단일 진입점)
  # =========================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: butterfly-obs-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # ACME challenge + HTTP→HTTPS redirect
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # LE 인증서 + ACME 계정 영구 저장
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      LE_EMAIL: ${LE_EMAIL}
      BASIC_AUTH_ADMIN_HASH: ${BASIC_AUTH_ADMIN_HASH}      # `caddy hash-password` 결과
      BASIC_AUTH_PROMTAIL_HASH: ${BASIC_AUTH_PROMTAIL_HASH}
    depends_on:
      - prometheus
      - loki
      - grafana
    networks: [obs]

  # =========================================================================
  # Prometheus — pull(scrape) + push(remote_write_receiver) 동시 운영
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: butterfly-obs-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'                # 운영 hot 30일 (log-policy.md)
      - '--web.enable-remote-write-receiver'               # AWS Promtail/agent push 수신
      - '--web.enable-lifecycle'                           # SIGHUP 없이 reload
      - '--web.external-url=https://${DOMAIN}/lgtm/prom'
      - '--web.route-prefix=/'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # 외부 직접 노출 X — Caddy만 접근.
    # 단 트러블슈팅 편의로 호스트 localhost만 바인드 (UFW로 9090 외부 차단 전제).
    ports:
      - "127.0.0.1:9090:9090"
    networks: [obs]

  # =========================================================================
  # Loki — single binary mode + filesystem (운영 30일/콜드 90일은 향후 Phase)
  # =========================================================================
  loki:
    image: grafana/loki:3.2.0
    container_name: butterfly-obs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # 외부 직접 노출 X — Caddy만 접근. (NodePort/Promtail은 Caddy /lgtm/loki 경유)
    networks: [obs]

  # =========================================================================
  # Grafana — Caddy /grafana sub-path 운영
  # =========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: butterfly-obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [obs]

  # =========================================================================
  # Alertmanager — 최소 라우팅 (Slack/Discord webhook은 .env에서 주입)
  # =========================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: butterfly-obs-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${DOMAIN}/lgtm/alerts'
      - '--web.route-prefix=/'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    networks: [obs]

networks:
  obs:
    name: butterfly-obs
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  grafana-data:
  alertmanager-data:
