# Butterfly Observability — k14b101.p.ssafy.io 에서 실행
#
# ADR-0018: node-exporter (K8s DaemonSet NodePort 30090) + Promtail → 본 서버로 수집.
# nginx(host 직접 설치)가 TLS 종료 + 경로 분기 담당. Caddy 없음.
#
# 부팅:
#   cd /home/ubuntu/monitoring && docker compose up -d
#
# 외부 노출 (nginx 경유):
#   https://k14b101.p.ssafy.io/grafana/     → grafana:3000
#   https://k14b101.p.ssafy.io/loki/        → loki:3100  (Promtail push)
#   https://k14b101.p.ssafy.io/prometheus/  → prometheus:9090 (내부 전용)

services:

  # =========================================================================
  # Prometheus — pull(scrape) + push(remote_write_receiver) 동시 운영
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'

  # =========================================================================
  # Loki — single binary mode + filesystem
  # =========================================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # =========================================================================
  # Grafana — nginx /grafana/ sub-path 운영
  # =========================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: "https://k14b101.p.ssafy.io/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-butterfly!2}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # =========================================================================
  # node-exporter — 로그 서버(k14b101) 자체 메트릭
  # K8s 노드 메트릭은 각 노드 DaemonSet NodePort 30090 에서 Prometheus가 pull
  # =========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # =========================================================================
  # k6 — 부하 테스트 (loadtest 프로파일에서만 실행)
  #   docker compose --profile loadtest run k6
  # =========================================================================
  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles: ["loadtest"]
    network_mode: host
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      - BASE_URL=https://k14b101.p.ssafy.io
      - API_PATH=/api/v1/auth/login
    command: ["run", "/scripts/api-load.js"]

networks:
  default:
    name: monitoring

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
