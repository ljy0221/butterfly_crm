# Prometheus scrape 설정 — 서버 실제 구성 기준
#
# ADR-0018: node-exporter (K8s DaemonSet NodePort 30090) pull
# cardinality 금지 라벨: userId / projectId / campaignId / requestId / traceId
#
# K8s 노드 EIP는 AWS 콘솔 확인 후 아래 placeholder 치환:
#   master:  AWS_MASTER_EIP  (3.34.240.94)
#   worker1: AWS_WORKER1_EIP (butterfly-api, butterfly-worker 실행 노드)
#   worker2: AWS_WORKER2_EIP
#   worker3: AWS_WORKER3_EIP
#   worker4: AWS_WORKER4_EIP

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod
    cluster: butterfly

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Alertmanager 미운영 (Phase 3 예정)

scrape_configs:

  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus

  # 로그 서버(k14b101) node-exporter — Docker 컨테이너가 host network로 실행 중
  - job_name: node-exporter-logserver
    static_configs:
      - targets: [172.18.0.1:9100]   # monitoring_default 브리지 게이트웨이 → host node-exporter
        labels:
          service: node-exporter
          node: logserver

  # K8s 노드 node-exporter (DaemonSet NodePort 30090)
  # 실제 EIP로 치환 필요 — kubectl get nodes -o wide 또는 AWS 콘솔 확인
  - job_name: node-exporter-k8s
    scrape_interval: 30s
    static_configs:
      - targets: [3.34.240.94:30090]
        labels:
          node: master
          tier: control-plane
      - targets: [15.165.115.142:30090]
        labels:
          node: worker-1
          tier: app
      - targets: [43.202.126.218:30090]
        labels:
          node: worker-2
          tier: app
      - targets: [AWS_WORKER3_EIP:30090]   # ip-10-0-2-199 (mysql node) — EIP 미확인
        labels:
          node: worker-3
          tier: db
      - targets: [AWS_WORKER4_EIP:30090]   # ip-10-0-2-191 (clickhouse node) — EIP 미확인
        labels:
          node: worker-4
          tier: db

  # Spring Boot Actuator — butterfly-api (worker-1 NodePort 30080)
  - job_name: butterfly-api
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    static_configs:
      - targets: [15.165.115.142:30080]
        labels:
          service: butterfly-api
          module: api
