# Butterfly CI/CD - Phase 3-1: 최소 동작 검증
# 목표: Runner가 job을 받고, pod이 뜨고, 명령이 실행되는지 확인

stages:
  - smoke

variables:
  # backend 디렉토리만 작업 대상
  BACKEND_DIR: backend

# 가장 단순한 job - hello world
smoke-test:
  stage: smoke
  image: alpine:3.20
  rules:
    # backend 또는 .gitlab-ci.yml 변경 시에만 실행
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - echo "============================================"
    - echo "✓ Runner is working!"
    - echo "✓ Pod scheduled and started"
    - echo "============================================"
    - echo "Job ID:        $CI_JOB_ID"
    - echo "Pipeline ID:   $CI_PIPELINE_ID"
    - echo "Branch:        $CI_COMMIT_REF_NAME"
    - echo "Commit:        $CI_COMMIT_SHORT_SHA"
    - echo "Runner:        $CI_RUNNER_DESCRIPTION"
    - echo "============================================"
    - echo "Verifying environment:"
    - uname -a
    - cat /etc/os-release | head -3
    - echo "============================================"
    - echo "Verifying repo checkout:"
    - ls -la
    - echo "---"
    - ls -la $BACKEND_DIR | head -15
