# Butterfly CI/CD - Phase 3-2: Gradle build
# Note: artifacts skipped due to GitLab size limit (will be replaced by Docker images in Phase 7)

stages:
  - smoke
  - build

variables:
  BACKEND_DIR: backend
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"

smoke-test:
  stage: smoke
  image: alpine:3.20
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - echo "=========================================="
    - echo "Smoke test passed"
    - 'echo "Pipeline: $CI_PIPELINE_ID, Commit: $CI_COMMIT_SHORT_SHA"'
    - echo "=========================================="

gradle-build:
  stage: build
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    - ./gradlew --version
  script:
    - echo "=========================================="
    - echo "Building all modules (test skipped)"
    - echo "=========================================="
    - ./gradlew clean assemble -x test --no-daemon
    - echo "=========================================="
    - echo "Build successful. Generated jars:"
    - ls -lh */build/libs/*.jar
