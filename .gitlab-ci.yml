# Butterfly CI/CD - Phase 12: build time optimization
# Changes from Phase 11:
#   - Removed smoke-test (no-op placeholder)
#   - Removed gradle-build (unit-test compiles, package builds image via jib)
#   - Moved checkstyle from quality stage into test stage (parallel with unit/integration)
#   - Enabled Gradle Build Cache (gradle.properties + --build-cache flag)

default:
  interruptible: true

# branch pipeline ↔ MR pipeline 중복 방지 (S14P31B101-220).
# MR이 열린 브랜치에 push하면 branch pipeline을 차단하고 MR pipeline만 돌린다.
# - feature push (MR 없음): branch pipeline 1회
# - MR 생성 이후 push: MR pipeline 1회 (branch pipeline 자동 차단)
# - develop/main merge commit: branch pipeline 1회 (통합 검증 + package)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - package

variables:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  # workers.max=2: K8s pod memory limit 내에서 통합 테스트 모듈 동시 실행 수를 제한.
  # 4개 모듈(api/event/campaign/reporting)이 동시에 SpringBoot 컨텍스트 + MySQL 컨테이너를
  # 띄울 때 OOMKilled(exit 137) 발생 → 2개로 제한하여 메모리 정점을 절반으로.
  # testsupport 컨테이너 공유와 함께 OOM 완화 (둘 다 필요).
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # CI 환경에서 npm install이 dev 의존성 포함 + audit 비활성화로 더 빠름
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

.gradle-cache: &gradle-cache
  cache:
    key:
      files:
        - backend/build.gradle
        - backend/gradle.properties
      prefix: "shared"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push

.npm-cache: &npm-cache
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: "fe-npm"
    paths:
      - frontend/node_modules/
    policy: pull-push

unit-test:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
  script:
    - ./gradlew test --build-cache --no-daemon
  artifacts:
    name: "test-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "backend/*/build/test-results/test/TEST-*.xml"
    paths:
      - "backend/*/build/reports/tests/test/"

integration-test:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # S14P31B101-226: 같은 잡 안에서 모듈 전환 시 컨테이너 재사용 (DinD daemon 1개 공유).
    # --no-parallel 순차 실행이므로 동시 사용 충돌 없음. 데이터 격리는 @DataJpaTest
    # 트랜잭션 자동 롤백 + Flyway schema_history로 보장.
    TESTCONTAINERS_REUSE_ENABLE: "true"
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    # docker daemon readiness 폴링 (기존 'sleep 10' 시간 기반 wait 대체)
    # eclipse-temurin:21-jdk 이미지는 docker CLI를 포함하지 않으므로 HTTP _ping 엔드포인트로 직접 폴링
    - |
      echo "Waiting for docker daemon at $DOCKER_HOST/_ping ..."
      for i in $(seq 1 60); do
        if wget -q -O- "http://docker:2375/_ping" 2>/dev/null | grep -q OK; then
          echo "docker daemon ready (took ${i}s)"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "docker daemon did not become ready within 60s" >&2
          exit 1
        fi
        sleep 1
      done
  script:
    # --no-parallel: 모듈별 integrationTest 동시 실행 방지 (Testcontainers MySQL × N개로 인한
    # CI runner OOMKilled 137 해결). unit-test/checkstyle 잡은 그대로 parallel 유지.
    - ./gradlew integrationTest --build-cache --no-daemon --no-parallel
  artifacts:
    name: "integration-test-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "backend/*/build/test-results/integrationTest/TEST-*.xml"
    paths:
      - "backend/*/build/reports/tests/integrationTest/"

checkstyle:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
  script:
    - ./gradlew checkstyleMain --build-cache --no-daemon
    - echo "Checkstyle violation summary:"
    - 'find . -name "main.xml" -path "*/checkstyle/*" -exec sh -c "echo {}: $(grep -c \"<error\" {}) errors" \;'
  artifacts:
    name: "checkstyle-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - "backend/*/build/reports/checkstyle/"

package:
  stage: package
  image: eclipse-temurin:21-jdk
  rules:
    # MR pipeline에서는 이미지 빌드 스킵 (test 잡으로 검증 완료, GHCR 태그 오염 방지)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_REF_NAME == "develop"
    - if: $CI_COMMIT_REF_NAME =~ /^(Feat|Fix|Hotfix|Chore)\//
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_REF_NAME =~ /^BE\/(Feat|Fix|Hotfix|Chore)\//
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  parallel:
    matrix:
      - MODULE:
          - butterfly-api
          - butterfly-worker
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    - 'test -n "$GHCR_USERNAME" || (echo "ERROR: GHCR_USERNAME not set"; exit 1)'
    - 'test -n "$GHCR_TOKEN" || (echo "ERROR: GHCR_TOKEN not set"; exit 1)'
    - 'test -n "$GHCR_NAMESPACE" || (echo "ERROR: GHCR_NAMESPACE not set"; exit 1)'
  script:
    - echo "Building image for module $MODULE"
    - 'echo "Target: ${GHCR_NAMESPACE}/${MODULE}:${CI_COMMIT_SHORT_SHA}"'
    - ./gradlew :${MODULE}:jib --build-cache --no-daemon

# ==========
# Frontend
# ==========
# 프론트엔드(React 18 + Vite + TypeScript)는 frontend/ 변경 시에만 트리거.
# 백엔드 변경에서는 자원 절약을 위해 미실행. 단 .gitlab-ci.yml 변경은 양쪽 모두 트리거.
# package 잡(이미지 빌드/배포)은 향후 별도 PR에서 추가 예정.
#
# type-check와 build를 한 잡으로 통합:
#   - npm run build가 내부적으로 'tsc -b --noEmit && vite build'를 수행
#     (package.json의 build 스크립트). 별도 type-check 잡은 동일 검증을 중복 수행
#   - 동일 이미지/캐시/의존성이라 잡 분리 시 npm ci 오버헤드 ~30~60s × 2,
#     pod 스케줄링 ~10~20s × 2의 비용만 추가되고 가시성 이득은 미미

frontend-build:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
  <<: *npm-cache
  before_script:
    - cd $FRONTEND_DIR
    - npm ci --prefer-offline --no-audit
  script:
    # tsc -b --noEmit + vite build (package.json의 build 스크립트 정의)
    - npm run build
  artifacts:
    name: "fe-build-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 1 week
    paths:
      - "frontend/dist/"

# ==========
# Diagnostics (S14P31B101-224)
# ==========
# Runner pod 자원 한도 측정용 1회성 잡. when: manual로 자동 트리거 0.
# 측정 결과는 integration-test --no-parallel 제거 / workers.max 복원 / 모듈별
# matrix 분할 등 병렬화 후속 결정의 근거로 사용한다.
# PAT 등 외부 토큰 의존 없음 — 컨테이너 내부 cgroup 정보만 read.
ci-diagnostics:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - echo "===== Runner identity ====="
    - 'echo "RUNNER_DESCRIPTION: ${CI_RUNNER_DESCRIPTION:-unknown}"'
    - 'echo "RUNNER_TAGS: ${CI_RUNNER_TAGS:-unknown}"'
    - 'echo "RUNNER_VERSION: ${CI_RUNNER_VERSION:-unknown}"'
    - 'echo "JOB_NAME: ${CI_JOB_NAME} / CONCURRENT_ID: ${CI_CONCURRENT_ID}"'
    - echo ""
    - echo "===== Memory (cgroup v2 → v1 fallback) ====="
    - 'cat /sys/fs/cgroup/memory.max 2>/dev/null && echo "  ^ cgroup v2 memory.max (bytes; max=unlimited)" || true'
    - 'cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null && echo "  ^ cgroup v1 memory.limit_in_bytes" || true'
    - 'cat /sys/fs/cgroup/memory.current 2>/dev/null && echo "  ^ cgroup v2 memory.current (bytes)" || true'
    - free -h || true
    - echo ""
    - echo "===== CPU ====="
    - 'echo "nproc: $(nproc)"'
    - 'cat /sys/fs/cgroup/cpu.max 2>/dev/null && echo "  ^ cgroup v2 cpu.max (quota period)" || true'
    - 'cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null && echo "  ^ cgroup v1 cpu.cfs_quota_us" || true'
    - 'cat /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null && echo "  ^ cgroup v1 cpu.cfs_period_us" || true'
    - echo ""
    - echo "===== Disk ====="
    - df -h . || true
    - echo ""
    - echo "===== Kernel / OS ====="
    - uname -a || true
    - 'cat /etc/os-release 2>/dev/null | head -5 || true'
