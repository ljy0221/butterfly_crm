# Butterfly CI/CD - Phase 2b: S3 cache enabled

stages:
  - smoke
  - build

variables:
  BACKEND_DIR: backend
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  # Gradle이 캐시 디렉토리를 어디에 만들지
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

smoke-test:
  stage: smoke
  image: alpine:3.20
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - echo "=========================================="
    - echo "Smoke test passed"
    - 'echo "Pipeline: $CI_PIPELINE_ID, Commit: $CI_COMMIT_SHORT_SHA"'
    - echo "=========================================="

gradle-build:
  stage: build
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  
  # S3 캐시 설정
  cache:
    key:
      files:
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/wrapper/gradle-wrapper.properties
      prefix: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    - ./gradlew --version
  script:
    - echo "=========================================="
    - echo "Building all modules (test skipped)"
    - echo "=========================================="
    - ./gradlew clean assemble -x test --no-daemon
    - echo "=========================================="
    - echo "Build successful. Cache stats:"
    - du -sh "$GRADLE_USER_HOME"/caches 2>/dev/null || echo "(no cache dir)"
    - ls -lh */build/libs/*.jar
