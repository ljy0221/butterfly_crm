# Butterfly CI/CD - Phase 6: Checkstyle added

stages:
  - smoke
  - build
  - test
  - quality

variables:
  BACKEND_DIR: backend
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

.gradle-cache: &gradle-cache
  cache:
    key:
      files:
        - backend/build.gradle
        - backend/settings.gradle
      prefix: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push

smoke-test:
  stage: smoke
  image: alpine:3.20
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - echo "Smoke test passed"
    - 'echo "Pipeline: $CI_PIPELINE_ID, Commit: $CI_COMMIT_SHORT_SHA"'

gradle-build:
  stage: build
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
    - ./gradlew --version
  script:
    - ./gradlew clean assemble -x test --no-daemon
    - ls -lh */build/libs/*.jar

unit-test:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
  script:
    - ./gradlew test --no-daemon
  artifacts:
    name: "test-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "backend/*/build/test-results/test/TEST-*.xml"
    paths:
      - "backend/*/build/reports/tests/test/"
  allow_failure: true

checkstyle:
  stage: quality
  image: eclipse-temurin:21-jdk
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  <<: *gradle-cache
  before_script:
    - cd $BACKEND_DIR
    - chmod +x ./gradlew
  script:
    - ./gradlew checkstyleMain --no-daemon
    - echo "=========================================="
    - echo "Checkstyle violation summary:"
    - 'find . -name "main.xml" -path "*/checkstyle/*" -exec sh -c "echo {}: $(grep -c \"<error\" {}) errors" \;'
  artifacts:
    name: "checkstyle-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - "backend/*/build/reports/checkstyle/"
