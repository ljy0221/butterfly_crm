apiVersion: apps/v1
kind: Deployment
metadata:
  name: butterfly-api
  namespace: butterfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: butterfly-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: butterfly-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        tier: heavy
      # Spring Boot가 K8s API를 호출하지 않으므로 default SA 토큰 마운트 불필요
      automountServiceAccountToken: false
      # Spring graceful shutdown(spring.lifecycle.timeout-per-shutdown-phase=30s) + Kafka rebalance 여유
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: butterfly-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # backend가 @Profile("api")로 EventProducer 등 빈을 게이팅함.
            # + 'prod' profile은 SecureSecurityConfig(@Profile("prod")) 활성화 → JWT 인증 + @PreAuthorize 인가.
            # prod 없으면 SecurityConfig(@Profile("!prod"))의 permitAll + LocalAuthFilter가 X-Member-Id 헤더로 인증 우회.
            # devtools 제거(S14P31B101-281 7d49775) 후 Jib runtimeClasspath에서 RestartClassLoader 사라져
            # @Profile("prod") 평가가 정상 진행 → SecureSecurityConfig 빈 등록 가능.
            - name: SPRING_PROFILES_ACTIVE
              value: "api,prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.butterfly.svc.cluster.local:3306/butterfly?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul"
            - name: SPRING_DATASOURCE_USERNAME
              value: "butterfly"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka.butterfly.svc.cluster.local:9092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.butterfly.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            # Toss Payments — K8s Secret(toss-secret)은 클러스터에 수동/운영 채널로 생성한다.
            # application.yml: butterfly.payment.toss.{client-key,secret-key}
            - name: TOSS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: toss-secret
                  key: client-key
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: toss-secret
                  key: secret-key
            # SMTP — Gmail 통합 (S14P31B101-290).
            # application.yml의 mail.{host,port,username,password,from,base-url}는 모두
            # env placeholder. 자격증명은 mail-secret(K8s Secret, 수동 생성)에서 주입.
            # MAIL_FROM은 Gmail SMTP가 인증된 주소로 강제 rewrite하므로 username과 동일.
            - name: MAIL_HOST
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: password
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: username
            - name: MAIL_BASE_URL
              value: "https://k14b101.p.ssafy.io"
            # ClickHouse 토글 (S14P31B101-300, ADR-0023).
            # true 면 ClickHouseUserDirectoryReaderAdapter 가 @Primary 로 등록되어 segment build
            # 의 filtered/mixed 경로가 ClickHouse 컬럼형 쿼리로 수행. false(기본) 면 기존 MySQL
            # UserDirectoryReaderAdapter 그대로 동작 → rollback 한 줄.
            # JDBC URL 파라미터:
            #   - socket_timeout=30000: long-running segment build SQL 여유
            #   - max_execution_time=60: server-side execution 한도
            #   - compress=true: 큰 결과셋 LZ4 압축 (clickhouse-jdbc 0.6.x 표준 param 명)
            # S14P31B101-305: 토글 ON. PR 1 (spike Java) develop merge + §3.4 CDC E2E 검증
            # 완료 시점에 "false" → "true" flip. ADR-0023 §B-5 토글 rollback backbone — 시연
            # 직전 사고 시 본 값을 "false" 로 되돌리는 한 줄 패치로 즉시 MySQL adapter 복귀.
            - name: BUTTERFLY_CLICKHOUSE_ENABLED
              value: "true"
            - name: CLICKHOUSE_URL
              value: "jdbc:clickhouse://clickhouse.butterfly.svc.cluster.local:8123/butterfly?socket_timeout=30000&max_execution_time=60&compress=true"
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: password
            # HikariCP pool size — ClickHouse 는 stateless HTTP 라 작아도 OK (researcher 4~10).
            - name: CLICKHOUSE_MAX_POOL_SIZE
              value: "4"
            # Spring AI / OpenAI 통합 (S14P31B101-309).
            # butterfly-ai 모듈이 spring-ai-starter-model-openai 의존, butterfly-api 만 의존.
            # application.yml 의 spring.ai 블록이 본 env 들을 placeholder 로 받음:
            #   - spring.ai.model.chat = ${SPRING_AI_MODEL_CHAT:none}
            #   - spring.ai.openai.api-key = ${OPENAI_API_KEY:}
            #   - spring.ai.openai.chat.options.model = ${OPENAI_MODEL:gpt-5.4-mini}
            # SPRING_AI_MODEL_CHAT=openai 로 ChatClient 빈 active. 미설정 시 default "none" 으로 AI 호출 비활성.
            - name: SPRING_AI_MODEL_CHAT
              value: "openai"
            - name: OPENAI_MODEL
              value: "gpt-5.4-mini"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: api-key
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # actuator의 mail health indicator는 매 헬스체크마다 SMTP 핸드셰이크를 시도해
            # Gmail 일시 장애 시 readiness probe까지 떨어뜨릴 위험이 있어 명시적으로 비활성화.
            # (readiness/liveness 그룹은 기본적으로 mail을 포함 안 해서 probe엔 무관)
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: "false"
            # 주의: Jib container.jvmFlags(-XX:MaxRAMPercentage=X)가 커맨드라인에서 나중에 적용되어
            # JAVA_TOOL_OPTIONS의 MaxRAMPercentage를 덮어쓴다. 실제 heap%는 backend/build.gradle의
            # jib.container.jvmFlags가 진실의 소스이므로 그쪽에서 60으로 설정됨.
            # 여기는 OOM 시 즉시 종료(restart로 복구)만 보강.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Seoul"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
