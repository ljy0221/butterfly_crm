apiVersion: apps/v1
kind: Deployment
metadata:
  name: butterfly-api
  namespace: butterfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: butterfly-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: butterfly-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        tier: heavy
      # Spring Boot가 K8s API를 호출하지 않으므로 default SA 토큰 마운트 불필요
      automountServiceAccountToken: false
      # Spring graceful shutdown(spring.lifecycle.timeout-per-shutdown-phase=30s) + Kafka rebalance 여유
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: butterfly-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # backend가 @Profile("api")로 EventProducer 등 빈을 게이팅함.
            # + 'prod' profile은 SecureSecurityConfig(@Profile("prod")) 활성화 → JWT 인증 + @PreAuthorize 인가.
            # prod 없으면 SecurityConfig(@Profile("!prod"))가 permitAll + LocalAuthFilter가 X-Member-Id 헤더로 인증 우회.
            - name: SPRING_PROFILES_ACTIVE
              value: "api,prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.butterfly.svc.cluster.local:3306/butterfly?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul"
            - name: SPRING_DATASOURCE_USERNAME
              value: "butterfly"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: app-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka.butterfly.svc.cluster.local:9092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.butterfly.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            # application.yml의 mail.from / mail.password 는 default 없는 placeholder라
            # env로 반드시 설정해야 PlaceholderResolutionException 회피.
            # 14일 시연용 — 실제 메일 발송 안 하므로 dummy 값.
            - name: MAIL_FROM
              value: "noreply@butterfly.local"
            - name: MAIL_PASSWORD
              value: ""
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # mail은 dummy SMTP(localhost:1025) — 실제 발송 안 함. health check에서 제외.
            # (readiness/liveness 그룹은 기본적으로 mail을 포함 안 해서 probe엔 무관)
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: "false"
            # 주의: Jib container.jvmFlags(-XX:MaxRAMPercentage=X)가 커맨드라인에서 나중에 적용되어
            # JAVA_TOOL_OPTIONS의 MaxRAMPercentage를 덮어쓴다. 실제 heap%는 backend/build.gradle의
            # jib.container.jvmFlags가 진실의 소스이므로 그쪽에서 60으로 설정됨.
            # 여기는 OOM 시 즉시 종료(restart로 복구)만 보강.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
