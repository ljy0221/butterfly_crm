apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: butterfly-api
  namespace: butterfly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: butterfly-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Spring Boot 부팅 중 JIT compile로 CPU 90~100% spike → 30초 평균이면 startup 중 의도하지 않은
    # scale-out fan-out 발생. 90초로 늘려 부팅 부하가 평균화된 후 결정하게 한다.
    scaleUp:
      stabilizationWindowSeconds: 90
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
