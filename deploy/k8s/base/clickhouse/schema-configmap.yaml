# events MergeTree + Kafka Engine queue + MaterializedView 초기 스키마 (S14P31B101-300).
#
# schema-job.yaml 의 PostSync Hook Job 이 본 ConfigMap 을 mount 하고 clickhouse-client 로 차례 실행.
# CREATE TABLE / MATERIALIZED VIEW 모두 IF NOT EXISTS 라 멱등 (재실행 무해).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-schema
  namespace: butterfly
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: butterfly
data:
  01-events-table.sql: |
    -- ADR-0023 §B-2: ReplacingMergeTree(event_uuid) — Kafka Engine at-least-once 중복 흡수.
    -- ORDER BY 끝에 event_uuid 포함 (dedup key). prefix(project_id, category_id, occurred_at)
    -- 는 segment build 쿼리의 WHERE 조건과 정확히 매칭 → sparse primary index 효과.
    -- PARTITION BY 월 단위 — 100M / 24개월 ≈ 월 4M row, part 수 적정.
    CREATE TABLE IF NOT EXISTS butterfly.events
    (
        event_id        UInt64,
        project_id      UInt64,
        user_id         UInt64,
        category_id     UInt64,
        device_id       UInt64,
        event_uuid      String,
        occurred_at     DateTime64(3, 'Asia/Seoul') CODEC(DoubleDelta, LZ4),
        schema_version  Int32,
        event_data      String,
        created_at      DateTime DEFAULT now(),
        updated_at      Nullable(DateTime)
    )
    ENGINE = ReplacingMergeTree()
    PARTITION BY toYYYYMM(occurred_at)
    ORDER BY (project_id, category_id, occurred_at, user_id, event_uuid)
    SETTINGS index_granularity = 8192;

  02-kafka-engine.sql: |
    -- Kafka Engine queue + MaterializedView — Spike 의 clickhouse-cdc-setup.sql 그대로.
    -- kafka_num_consumers=1: events.collected 가 단일 partition 가정 (Step 8 §0.3 사전 확인).
    -- multi-partition 이면 PartitionCount 와 동일 값으로 수정 + ConfigMap 재apply 필요.
    CREATE TABLE IF NOT EXISTS butterfly.events_kafka_queue
    (
        event_uuid     String,
        project_id     UInt64,
        user_id        UInt64,
        device_id      UInt64,
        category_id    UInt64,
        occurred_at    DateTime64(3),
        schema_version Int32,
        event_data     String
    )
    ENGINE = Kafka
    SETTINGS
        kafka_broker_list = 'kafka-0.kafka.butterfly.svc.cluster.local:9092',
        kafka_topic_list = 'events.collected',
        kafka_group_name = 'clickhouse-events-collected',
        kafka_format = 'JSONEachRow',
        kafka_num_consumers = 1,
        kafka_max_block_size = 10000,
        input_format_skip_unknown_fields = 1,
        input_format_import_nested_json = 0;

    CREATE MATERIALIZED VIEW IF NOT EXISTS butterfly.events_cdc_mv
    TO butterfly.events
    AS SELECT
        0           AS event_id,
        project_id,
        user_id,
        category_id,
        device_id,
        event_uuid,
        occurred_at,
        schema_version,
        event_data,
        now()       AS created_at,
        CAST(NULL AS Nullable(DateTime)) AS updated_at
    FROM butterfly.events_kafka_queue;
