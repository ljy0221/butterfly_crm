# ClickHouse Service (S14P31B101-300).
#
# - 8123 HTTP: api/worker 의 clickhouse-jdbc 0.6.5 가 사용 (researcher: HTTP 가 기본/권장)
# - 9000 native: schema-job 의 clickhouse-client 가 사용 (native TCP protocol)
# ClusterIP 이므로 K8s overlay 안에서만 통신 — 호스트 SG 에는 8123/9000 노출 안 됨.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: butterfly
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: butterfly
    app.kubernetes.io/version: "24.8"
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP
