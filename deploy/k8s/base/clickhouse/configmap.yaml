# ClickHouse server config 오버라이드 (S14P31B101-300).
#
# - max_server_memory_usage_to_ram_ratio 0.7
#   StatefulSet limits.memory 6Gi 의 70% = 4.2Gi 까지 ClickHouse 가 사용. 25%는 OS page cache,
#   5%는 K3s 의 system reserved=0 환경에서 kube-system DaemonSet eviction 방어 마진.
# - listen_host 0.0.0.0: Pod IP 외 cluster IP 도 받기.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: butterfly
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: butterfly
    app.kubernetes.io/version: "24.8"
data:
  override.xml: |
    <clickhouse>
        <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
        <listen_host>0.0.0.0</listen_host>
        <logger>
            <level>information</level>
        </logger>
    </clickhouse>
