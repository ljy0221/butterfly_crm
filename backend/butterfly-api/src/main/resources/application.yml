spring:
  application:
    name: butterfly-api
  profiles:
    active: api, worker

  # MySQL
  datasource:
    url: 'jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:butterfly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul'
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  # ddl-auto=update는 베이스라인 안정화까지의 한시 정책 (ADR-0013).
  # 도메인별 정합성 검증이 모두 끝나면 별도 티켓에서 ddl-auto=validate로 강등한다.
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Flyway (ADR-0013) — butterfly-api가 베이스라인 V1/V2/V3을 보유.
  # V1: core_baseline (B그룹 22개), V2: reporting_baseline (A그룹 10개), V3: audit triggers.
  # 빈 DB 가정. baseline-on-migrate=true는 기존 reporting V1~V13 흔적이 남은 환경 호환용.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    # Pageable — 클라이언트가 ?size=10000 등 과도한 페이지 크기를 요청하지 못하도록 상한.
    # OOM 방지: 최대 100건 (운영 정책에 맞춰 조정 가능).
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.b101.butterfly.event.messaging
        spring.json.value.default.type: com.b101.butterfly.event.messaging.EventPayload

  # Mail (로컬: MailHog)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: '${MAIL_USERNAME:}'
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 604800000

# AES_KEY 는 S14P31B101-206 으로 AesEncryptionService 가 제거되면서 미사용.
# FCM 자격 증명 암호화는 Phase 2 에서 별도 결정 (KMS 또는 시크릿 매니저 직접 주입).

# CORS — 콤마 구분. 운영은 BUTTERFLY_CORS_ALLOWED_ORIGINS 환경변수로 override.
# 기본값: localhost SPA 포트 (3000/5173-5175 Vite/8080).
butterfly:
  cors:
    allowed-origins: '${BUTTERFLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080}'
  # Rate limiting — Redis 분 단위 카운터. memberId(인증) 또는 client IP 별로 카운팅.
  # requests-per-minute: 정상 평균 허용량, burst-capacity: 윈도우 내 최대 누적치(초과 시 429).
  ratelimit:
    enabled: ${BUTTERFLY_RATELIMIT_ENABLED:true}
    requests-per-minute: ${BUTTERFLY_RATELIMIT_RPM:60}
    burst-capacity: ${BUTTERFLY_RATELIMIT_BURST:100}
    # endpoint별 차등 RPM은 application-api.yml 에서 YAML Map 문법으로 정의.
    # (콜론(:) 포함 key는 .properties 형식으로 표현 불가 — YAML 사용)

mail:
  from: ${MAIL_FROM}
  base-url: ${MAIL_BASE_URL:http://localhost:5175}
