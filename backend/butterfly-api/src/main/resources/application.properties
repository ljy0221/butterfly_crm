spring.application.name=butterfly-api

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/butterfly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# JWT
jwt.secret=${JWT_SECRET:butterfly-dev-secret-key-must-be-32chars!!}
jwt.access-token-expiry-ms=1800000
jwt.refresh-token-expiry-ms=604800000

# AES-256 (FCM 자격증명 암호화)
aes.secret-key=${AES_KEY:0123456789abcdef0123456789abcdef}

# Mail (로컬: MailHog)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@butterfly.io}
mail.base-url=${MAIL_BASE_URL:http://localhost:3000}
