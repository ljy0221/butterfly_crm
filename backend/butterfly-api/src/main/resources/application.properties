spring.application.name=butterfly-api
spring.profiles.active=api, worker

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:butterfly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# ddl-auto=update는 베이스라인 안정화까지의 한시 정책 (ADR-0013).
# 도메인별 정합성 검증이 모두 끝나면 별도 티켓에서 ddl-auto=validate로 강등한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway (ADR-0013) — butterfly-api가 베이스라인 V1/V2/V3을 보유.
# V1: core_baseline (B그룹 22개), V2: reporting_baseline (A그룹 10개), V3: audit triggers.
# 빈 DB 가정. baseline-on-migrate=true는 기존 reporting V1~V13 흔적이 남은 환경 호환용.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.b101.butterfly.event.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.b101.butterfly.event.messaging.EventPayload

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=1800000
jwt.refresh-token-expiry-ms=604800000

# Pageable — 클라이언트가 ?size=10000 등 과도한 페이지 크기를 요청하지 못하도록 상한.
# OOM 방지: 최대 100건 (운영 정책에 맞춰 조정 가능).
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# CORS — 콤마 구분. 운영은 BUTTERFLY_CORS_ALLOWED_ORIGINS 환경변수로 override.
# 기본값: localhost SPA 포트 (3000/5173-5175 Vite/8080).
butterfly.cors.allowed-origins=${BUTTERFLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080}

# Rate limiting — Redis 분 단위 카운터. memberId(인증) 또는 client IP 별로 카운팅.
# requests-per-minute: 정상 평균 허용량, burst-capacity: 윈도우 내 최대 누적치(초과 시 429).
butterfly.ratelimit.enabled=${BUTTERFLY_RATELIMIT_ENABLED:true}
butterfly.ratelimit.requests-per-minute=${BUTTERFLY_RATELIMIT_RPM:60}
butterfly.ratelimit.burst-capacity=${BUTTERFLY_RATELIMIT_BURST:100}
# endpoint별 차등 RPM은 application-api.yml 에서 YAML Map 문법으로 정의.
# (콜론(:) 포함 key는 .properties 형식으로 표현 불가 — YAML 사용)
# SDK API Key 레이트 리밋 — 프로젝트별 100 req/sec (합의값, S14P31B101-193)
butterfly.ratelimit.api-key.requests-per-second=${BUTTERFLY_APIKEY_RATELIMIT_RPS:100}

# Mail (로컬: MailHog)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM}
mail.base-url=${MAIL_BASE_URL:http://localhost:5175}
