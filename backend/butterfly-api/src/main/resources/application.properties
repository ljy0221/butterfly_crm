spring.application.name=butterfly-api
spring.profiles.active=api

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/butterfly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# ddl-auto=update는 베이스라인 안정화까지의 한시 정책 (ADR-0013).
# 도메인별 정합성 검증이 모두 끝나면 별도 티켓에서 ddl-auto=validate로 강등한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway (ADR-0013) — butterfly-api가 베이스라인 V1/V2/V3을 보유.
# V1: core_baseline (B그룹 22개), V2: reporting_baseline (A그룹 10개), V3: audit triggers.
# 빈 DB 가정. baseline-on-migrate=true는 기존 reporting V1~V13 흔적이 남은 환경 호환용.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT
jwt.secret=${JWT_SECRET:butterfly-dev-secret-key-must-be-32chars!!}
jwt.access-token-expiry-ms=1800000
jwt.refresh-token-expiry-ms=604800000

# AES-256 (FCM 자격증명 암호화)
aes.secret-key=${AES_KEY:0123456789abcdef0123456789abcdef}

# Mail (로컬: MailHog)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@butterfly.io}
mail.base-url=${MAIL_BASE_URL:http://localhost:3000}
