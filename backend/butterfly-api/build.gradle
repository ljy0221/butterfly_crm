plugins {
    id 'org.springframework.boot'
}

bootJar { enabled = true }
jar { enabled = false }

dependencies {
    implementation project(':butterfly-common')
    implementation project(':butterfly-auth')
    implementation project(':butterfly-tenant')
    implementation project(':butterfly-event')
    implementation project(':butterfly-segment')
    implementation project(':butterfly-campaign')
    implementation project(':butterfly-ai')
    implementation project(':butterfly-notification')
    implementation project(':butterfly-reporting')
    implementation project(':butterfly-payment')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // CampaignExecutionPort 어댑터 (config/wiring) — EntityManager + @Transactional 사용.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway (ADR-0013) — butterfly-api가 베이스라인 V1/V2/V3을 보유한다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':butterfly-testsupport')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework:spring-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
