jar { enabled = true }

dependencies {
    implementation project(':butterfly-common')
    implementation project(':butterfly-auth')
    implementation project(':butterfly-segment')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // S14P31B101-275 — ClickHouse JDBC. butterfly.clickhouse.enabled=true 일 때 사용.
    implementation 'com.clickhouse:clickhouse-jdbc:0.6.5:all'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':butterfly-testsupport')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
