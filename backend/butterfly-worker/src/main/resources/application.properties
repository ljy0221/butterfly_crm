spring.application.name=butterfly-worker
spring.profiles.active=worker
spring.main.web-application-type=none

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:butterfly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway 비활성화 — butterfly-api가 마이그레이션 주체 (ADR-0013).
# docker-compose의 depends_on: condition: service_healthy + api healthcheck로
# api 마이그레이션 완료 후 worker 부팅을 보장한다. (api healthcheck 보강은 별도 티켓)
spring.flyway.enabled=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.b101.butterfly.event.messaging
spring.kafka.consumer.properties.spring.json.value.default.type=com.b101.butterfly.event.messaging.EventPayload
