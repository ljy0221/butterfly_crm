spring.application.name=butterfly-worker
spring.profiles.active=worker
spring.main.web-application-type=none

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:butterfly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP — 60초 이상 connection checkout 시 leak 의심 경고 (S14P31B101-243).
spring.datasource.hikari.leak-detection-threshold=60000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# runaway query 안전판 — 540초 초과 시 SQL 중단 (S14P31B101-243).
# filtered EVENT EXISTS worst-case(~530s) 보다 약간 여유.
spring.jpa.properties.jakarta.persistence.query.timeout=540000
spring.jpa.open-in-view=false

# Flyway 비활성화 — butterfly-api가 마이그레이션 주체 (ADR-0013).
# docker-compose의 depends_on: condition: service_healthy + api healthcheck로
# api 마이그레이션 완료 후 worker 부팅을 보장한다. (api healthcheck 보강은 별도 티켓)
spring.flyway.enabled=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.b101.butterfly.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.b101.butterfly.event.messaging.EventPayload
# Kafka max.poll.interval.ms — SegmentBuildJob 의 filtered EVENT EXISTS worst-case(~530s) 보다
# 충분히 여유 있게 15분 (S14P31B101-243 Phase 1). Phase 2 에서 listener=claim-only 분리되면 기본값 복귀 가능.
spring.kafka.consumer.properties.max.poll.interval.ms=900000

# Kafka Producer (DeliveryCommand)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Mail — worker process 는 notification 모듈을 implementation 의존하므로
# EmailChannelAdapter -> EmailService -> JavaMailSender 빈이 컨텍스트 부팅 시점에 필수.
# 실 발송은 호출 시점에만 SMTP 시도하므로 부팅 자체에는 영향 없음 (MailHog 미부팅 OK).
# 로컬: MailHog (localhost:1025). butterfly-api/application.yml 의 mail 설정과 동일.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
