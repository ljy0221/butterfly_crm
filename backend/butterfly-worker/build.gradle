plugins {
    id 'org.springframework.boot'
}

// 통합 부팅(S14P31B101-234): butterfly-api가 worker 모듈을 implementation 의존으로 끌어가
// 한 process 안에서 Kafka 컨슈머/리스너를 동시 구동한다. 그래서 worker는 더 이상 자체 bootJar로
// 부팅되지 않으며, 일반 jar(클래스 + 리소스 묶음)만 만들어 api jar에 포함된다.
bootJar { enabled = false }
jar { enabled = true }

dependencies {
    implementation project(':butterfly-common')
    implementation project(':butterfly-auth')
    implementation project(':butterfly-event')
    implementation project(':butterfly-segment')
    implementation project(':butterfly-campaign')
    implementation project(':butterfly-notification')
    implementation project(':butterfly-reporting')

    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway (ADR-0013) — api와 동일 DB. schema_history 락으로 동시 부팅 시 안전하게 직렬화됨.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility'
    // EventsPersistedSegmentIntegrationTest (develop merge 후) 가
    // AbstractMySqlContainerTest + GenericContainer + DockerImageName 사용.
    testImplementation project(':butterfly-testsupport')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
