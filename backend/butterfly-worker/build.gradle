plugins {
    id 'org.springframework.boot'
}

bootJar { enabled = true }
jar { enabled = false }

dependencies {
    implementation project(':butterfly-common')
    implementation project(':butterfly-auth')
    implementation project(':butterfly-event')
    implementation project(':butterfly-segment')
    implementation project(':butterfly-campaign')
    implementation project(':butterfly-notification')
    implementation project(':butterfly-reporting')

    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway (ADR-0013) — api와 동일 DB. schema_history 락으로 동시 부팅 시 안전하게 직렬화됨.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation project(':butterfly-testsupport')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
