# S14P31B101-294: campaign.send.requested 토픽 측정 인프라
#
# 평소 실행:
#   docker compose -f docker-compose-local.yml -f docker-compose-observability.yml up -d
#
# K6 부하 시나리오 실행 (profiles=measure 라 up 시 자동 실행 안 됨):
#   docker compose -f docker-compose-local.yml -f docker-compose-observability.yml \
#     run --rm k6 run /scripts/k6-scenario-B-throughput.js
#
# Prometheus UI: http://localhost:9090
# Grafana UI:    http://localhost:3000 (anonymous viewer, admin/butterfly)
#
# Spring app actuator scrape target: host.docker.internal:8080/actuator/prometheus
# (api 한 process 안에 worker 빈 통합 — S14P31B101-234 결정 — actuator 한 개)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: butterfly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-admin-api'                   # snapshot API 사용
      - '--web.enable-lifecycle'                   # config reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: butterfly-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/portfolio-graphs:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: butterfly
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.53.0
    container_name: butterfly-k6
    profiles: ["measure"]                          # up 시 자동 실행 X — run 으로 호출
    volumes:
      - ./scripts/measure:/scripts:ro
      - ./docs/portfolio-graphs:/output            # 결과 파일 호스트에 영구 저장
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    entrypoint: ["k6"]
    # 사용 예:
    #   docker compose ... run --rm k6 run \
    #     --out json=/output/baseline-results/B-throughput-raw.json \
    #     --out csv=/output/baseline-results/B-throughput-raw.csv \
    #     --summary-export=/output/baseline-results/B-throughput-summary.json \
    #     /scripts/k6-scenario-B-throughput.js

volumes:
  prometheus-data:
  grafana-data:
