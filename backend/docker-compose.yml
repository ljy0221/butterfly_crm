services:
  mysql:
    image: mysql:8.0
    container_name: butterfly-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: butterfly
      MYSQL_USER: butterfly
      MYSQL_PASSWORD: butterfly
    volumes:
      - mysql-data:/var/lib/mysql
    # S14P31B101-269 — buffer pool 128MB(디폴트) 가 100M events 테이블 hot range 를 못 담아
    # random IO 누적, Innodb_buffer_pool_wait_free 가 분 단위로 쌓이는 문제 해소.
    # tmp/heap 도 GROUP BY 877k user 가 16MB 디폴트를 초과해 디스크 spill 되는 것 회피.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=2G
      --tmp-table-size=256M
      --max-heap-table-size=256M

  redis:
    image: redis:7-alpine
    container_name: butterfly-redis
    ports:
      - "6379:6379"

  # S14P31B101-275 — ClickHouse PoC. segment build SQL 의 events 100M scan 을 columnar 로 가속.
  # native TCP 9000 / HTTP 8123. 같은 docker network 라 'mysql:3306' 으로 mysql() 테이블 함수 접근 가능.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: butterfly-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: butterfly
      CLICKHOUSE_USER: butterfly
      CLICKHOUSE_PASSWORD: butterfly
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  kafka:
    image: apache/kafka:3.7.0
    container_name: butterfly-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: butterfly-kafka-cluster-001

volumes:
  mysql-data:
  clickhouse-data:
