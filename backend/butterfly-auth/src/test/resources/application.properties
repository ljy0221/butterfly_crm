# 테스트 전용 설정 — 실제 DB/Redis 연결 없이 H2 인메모리 사용
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Redis Mock (테스트에서 Mockito로 대체하므로 실제 연결 불필요)
spring.data.redis.host=localhost
spring.data.redis.port=6370

jwt.secret=test-secret-key-must-be-at-least-32-chars-long!!
jwt.access-token-expiry-ms=1800000
jwt.refresh-token-expiry-ms=604800000

mail.from=test@butterfly.io
mail.base-url=http://localhost:3000

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
