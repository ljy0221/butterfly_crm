plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.cloud.tools.jib' version '3.4.4' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'
    apply plugin: 'com.google.cloud.tools.jib'

    group = 'com.b101.butterfly'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.13"
            mavenBom "org.springframework.ai:spring-ai-bom:1.1.6"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    // butterfly-testsupport와 butterfly-archtest는 integrationTest 대상 아님
    if (project.name != 'butterfly-testsupport' && project.name != 'butterfly-archtest') {
        tasks.register('integrationTest', Test) {
            description = 'Runs JUnit tests tagged "integration".'
            group = 'verification'
            useJUnitPlatform {
                includeTags 'integration'
            }
            shouldRunAfter tasks.named('test')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            reports {
                html.outputLocation = layout.buildDirectory.dir("reports/tests/integrationTest")
                junitXml.outputLocation = layout.buildDirectory.dir("test-results/integrationTest")
            }
            binaryResultsDirectory = layout.buildDirectory.dir("test-results/integrationTest/binary")
            testLogging {
                showStandardStreams = true
            }
        }
    }

    // ===== Checkstyle =====
    checkstyle {
        toolVersion = '10.12.5'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = true
        sourceSets = [sourceSets.main]
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            html.required = true
            xml.required = true
        }
    }

    // ===== Jib (설정은 Spring Boot 모듈에만) =====
    afterEvaluate {
        if (plugins.hasPlugin('org.springframework.boot')) {
            def registryNamespace = System.getenv('GHCR_NAMESPACE') ?: "ghcr.io/local"
            def registryUsername = System.getenv('GHCR_USERNAME') ?: ""
            def registryToken = System.getenv('GHCR_TOKEN') ?: ""
            def gitSha = System.getenv('CI_COMMIT_SHORT_SHA') ?: "local"
            def branch = (System.getenv('CI_COMMIT_REF_SLUG') ?: "local").toLowerCase()

            jib {
                from {
                    image = 'eclipse-temurin:21-jre'
                    auth {
                        username = System.getenv("DOCKER_USERNAME") ?: ""
                        password = System.getenv("DOCKER_PASSWORD") ?: ""
                    }
                    platforms {
                        platform {
                            architecture = 'amd64'
                            os = 'linux'
                        }
                        platform {
                            architecture = 'arm64'
                            os = 'linux'
                        }
                    }
                }
                to {
                    image = "${registryNamespace}/${project.name}"
                    def imageTags = [gitSha, branch]
                    if (branch == 'develop' || branch == 'main') {
                        imageTags << 'latest'
                    }
                    tags = imageTags
                    auth {
                        username = registryUsername
                        password = registryToken
                    }
                }
                container {
                    // MaxRAMPercentage 60%: K8s Deployment limits.memory(1.5G/1G)의 ~60%만 heap에
                    // 할당. 나머지 ~600MB는 metaspace/direct buffer/Netty/Kafka producer/GC overhead로
                    // 두어 cgroup limit과 마진 확보. 75%는 부하 시 OOMKill 마진이 빠듯하다.
                    jvmFlags = [
                        '-XX:+UseContainerSupport',
                        '-XX:MaxRAMPercentage=60.0',
                        '-Djava.security.egd=file:/dev/./urandom'
                    ]
                    ports = ['8080']
                    environment = [
                        'SPRING_PROFILES_ACTIVE': 'prod'
                    ]
                    creationTime = 'USE_CURRENT_TIMESTAMP'
                }
            }
        }
    }
}
