spring.application.name=butterfly-reporting-test

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway off — 테스트는 ddl-auto로 스키마를 만들고 트리거는 @Sql로 직접 적용한다.
spring.flyway.enabled=false

# V21 FK 추가 이후 notification_logs 등이 projects/members/campaigns를 참조하므로
# Hibernate ddl-auto 완료 후 부모 픽스처 테이블을 생성한다.
spring.sql.init.schema-locations=classpath:db/test/parent_fixture_tables.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
